version: "3.8"

services:
    # PostgreSQL Database (Development & Production)
    postgres:
        image: postgres:15-alpine
        container_name: kol_postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
            POSTGRES_DB: kol_management
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # PostgreSQL Test Database (Separate for testing)
    postgres_test:
        image: postgres:15-alpine
        container_name: kol_postgres_test
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres_test
            POSTGRES_DB: kol_management_test
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data # In-memory for faster tests
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 3

    # Redis (for caching and Celery - Phase 2)
    redis:
        image: redis:7-alpine
        container_name: kol_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # pgAdmin (Optional - Database UI)
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: kol_pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@kol.local
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "5050:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            - postgres
        profiles:
            - ui # Only start with: docker-compose --profile ui up

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    pgadmin_data:
        driver: local
