# Example Nginx Reverse Proxy Configuration for KOL System
# Place this in your server's /etc/nginx/sites-available/

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.yourdomain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server - Production with Nginx Proxy (Port 8766)
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/yourdomain.com.crt;
    ssl_certificate_key /etc/ssl/private/yourdomain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/kolsystem_access.log;
    error_log /var/log/nginx/kolsystem_error.log;

    # Client upload size
    client_max_body_size 10M;

    # Proxy to KOL System (Production - Port 8766)
    location / {
        proxy_pass http://localhost:8766;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (bypass cache)
    location /health {
        proxy_pass http://localhost:8766/health;
        proxy_set_header Host $host;
        proxy_cache_bypass 1;
        access_log off;
    }

    # API documentation
    location /docs {
        proxy_pass http://localhost:8766/docs;
        proxy_set_header Host $host;
    }

    # Static files (if served separately)
    location /static/ {
        alias /var/www/kolsystem/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

