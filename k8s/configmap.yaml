apiVersion: v1
kind: ConfigMap
metadata:
  name: kol-system-config
  namespace: kol-system
  labels:
    app: kol-management-system
    component: config
data:
  # Application Configuration
  APP_NAME: "KOL Influencer Management System"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"

  # Database Configuration
  DATABASE_ECHO: "false"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"

  # Redis Configuration
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_CELERY_BROKER_URL: "redis://redis-service:6379/1"
  REDIS_CELERY_BACKEND_URL: "redis://redis-service:6379/2"

  # Celery Configuration
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  CELERY_TIMEZONE: "UTC"
  CELERY_ENABLE_UTC: "true"

  # Rate Limiting
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"

  # Content Monitoring
  CONTENT_DETECTION_CONFIDENCE_THRESHOLD: "0.6"

  # File Storage
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE: "10485760"  # 10MB

  # Monitoring and Logging
  LOG_LEVEL: "INFO"
  PROMETHEUS_METRICS_ENABLED: "true"

  # GDPR Compliance
  DATA_RETENTION_DAYS: "365"
  GDPR_COMPLIANCE_ENABLED: "true"

  # CORS Configuration
  CORS_ORIGINS: "https://kolsystem.com,https://app.kolsystem.com"
  ALLOWED_HOSTS: "kolsystem.com,app.kolsystem.com,api.kolsystem.com"

  # API Configuration
  API_BASE_URL: "https://api.kolsystem.com"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kol-system-config-staging
  namespace: kol-system-staging
  labels:
    app: kol-management-system
    component: config
    environment: staging
data:
  # Application Configuration
  APP_NAME: "KOL Influencer Management System (Staging)"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "staging"
  DEBUG: "true"

  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"

  # Database Configuration
  DATABASE_ECHO: "true"
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "15"

  # Redis Configuration
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_CELERY_BROKER_URL: "redis://redis-service:6379/1"
  REDIS_CELERY_BACKEND_URL: "redis://redis-service:6379/2"

  # Celery Configuration
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  CELERY_TIMEZONE: "UTC"
  CELERY_ENABLE_UTC: "true"

  # Rate Limiting
  RATE_LIMIT_REQUESTS_PER_MINUTE: "200"

  # Content Monitoring
  CONTENT_DETECTION_CONFIDENCE_THRESHOLD: "0.5"

  # File Storage
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE: "10485760"

  # Monitoring and Logging
  LOG_LEVEL: "DEBUG"
  PROMETHEUS_METRICS_ENABLED: "true"

  # GDPR Compliance
  DATA_RETENTION_DAYS: "90"
  GDPR_COMPLIANCE_ENABLED: "true"

  # CORS Configuration
  CORS_ORIGINS: "https://staging.kolsystem.com"
  ALLOWED_HOSTS: "staging.kolsystem.com"

  # API Configuration
  API_BASE_URL: "https://staging-api.kolsystem.com"