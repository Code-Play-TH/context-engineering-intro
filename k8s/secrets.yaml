apiVersion: v1
kind: Secret
metadata:
  name: kol-system-secrets
  namespace: kol-system
  labels:
    app: kol-management-system
    component: secrets
type: Opaque
stringData:
  # Database Secrets
  DATABASE_URL: "postgresql+asyncpg://koluser:CHANGE_ME_IN_PRODUCTION@postgres-service:5432/koldb"

  # Security Secrets
  SECRET_KEY: "CHANGE_ME_TO_SECURE_SECRET_KEY_IN_PRODUCTION"

  # Social Media API Keys (Replace with actual keys)
  INSTAGRAM_ACCESS_TOKEN: "REPLACE_WITH_ACTUAL_INSTAGRAM_TOKEN"
  YOUTUBE_API_KEY: "REPLACE_WITH_ACTUAL_YOUTUBE_API_KEY"
  TWITTER_BEARER_TOKEN: "REPLACE_WITH_ACTUAL_TWITTER_TOKEN"
  TIKTOK_ACCESS_TOKEN: "REPLACE_WITH_ACTUAL_TIKTOK_TOKEN"
  FACEBOOK_ACCESS_TOKEN: "REPLACE_WITH_ACTUAL_FACEBOOK_TOKEN"

  # Communication API Keys
  SENDGRID_API_KEY: "REPLACE_WITH_ACTUAL_SENDGRID_KEY"
  AWS_SES_ACCESS_KEY_ID: "REPLACE_WITH_ACTUAL_AWS_ACCESS_KEY"
  AWS_SES_SECRET_ACCESS_KEY: "REPLACE_WITH_ACTUAL_AWS_SECRET_KEY"
  DISCORD_BOT_TOKEN: "REPLACE_WITH_ACTUAL_DISCORD_TOKEN"
  LINE_CHANNEL_ACCESS_TOKEN: "REPLACE_WITH_ACTUAL_LINE_TOKEN"
  LINE_CHANNEL_SECRET: "REPLACE_WITH_ACTUAL_LINE_SECRET"

  # AI and Analytics
  AI_CONTENT_ANALYSIS_API_KEY: "REPLACE_WITH_ACTUAL_AI_API_KEY"

  # Monitoring
  SENTRY_DSN: "REPLACE_WITH_ACTUAL_SENTRY_DSN"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: kol-system
  labels:
    app: postgres
    component: database
type: Opaque
stringData:
  POSTGRES_DB: "koldb"
  POSTGRES_USER: "koluser"
  POSTGRES_PASSWORD: "CHANGE_ME_TO_SECURE_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: kol-system
  labels:
    app: redis
    component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "CHANGE_ME_TO_SECURE_REDIS_PASSWORD"

---
# Staging Secrets
apiVersion: v1
kind: Secret
metadata:
  name: kol-system-secrets
  namespace: kol-system-staging
  labels:
    app: kol-management-system
    component: secrets
    environment: staging
type: Opaque
stringData:
  # Database Secrets
  DATABASE_URL: "postgresql+asyncpg://koluser_staging:CHANGE_ME_IN_STAGING@postgres-service:5432/koldb_staging"

  # Security Secrets
  SECRET_KEY: "CHANGE_ME_TO_STAGING_SECRET_KEY"

  # Test/Staging API Keys (Use sandbox/test keys)
  INSTAGRAM_ACCESS_TOKEN: "STAGING_INSTAGRAM_TOKEN"
  YOUTUBE_API_KEY: "STAGING_YOUTUBE_API_KEY"
  TWITTER_BEARER_TOKEN: "STAGING_TWITTER_TOKEN"
  TIKTOK_ACCESS_TOKEN: "STAGING_TIKTOK_TOKEN"
  FACEBOOK_ACCESS_TOKEN: "STAGING_FACEBOOK_TOKEN"

  # Communication API Keys (Test keys)
  SENDGRID_API_KEY: "STAGING_SENDGRID_KEY"
  DISCORD_BOT_TOKEN: "STAGING_DISCORD_TOKEN"
  LINE_CHANNEL_ACCESS_TOKEN: "STAGING_LINE_TOKEN"
  LINE_CHANNEL_SECRET: "STAGING_LINE_SECRET"

  # AI and Analytics
  AI_CONTENT_ANALYSIS_API_KEY: "STAGING_AI_API_KEY"

  # Monitoring
  SENTRY_DSN: "STAGING_SENTRY_DSN"