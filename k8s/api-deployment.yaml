apiVersion: apps/v1
kind: Deployment
metadata:
  name: kol-api
  namespace: kol-system
  labels:
    app: kol-api
    component: backend
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kol-api
      component: backend
  template:
    metadata:
      labels:
        app: kol-api
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: kol-api
        image: kolsystem/api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        # Environment variables from ConfigMap
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: APP_NAME
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: APP_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: ENVIRONMENT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: DEBUG
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: PORT

        # Database Configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: DATABASE_URL
        - name: DATABASE_ECHO
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: DATABASE_ECHO
        - name: DATABASE_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: DATABASE_POOL_SIZE
        - name: DATABASE_MAX_OVERFLOW
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: DATABASE_MAX_OVERFLOW

        # Redis Configuration
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: REDIS_URL
        - name: REDIS_CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: REDIS_CELERY_BROKER_URL
        - name: REDIS_CELERY_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: REDIS_CELERY_BACKEND_URL

        # Security Configuration
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: SECRET_KEY

        # Social Media API Keys
        - name: INSTAGRAM_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: INSTAGRAM_ACCESS_TOKEN
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: YOUTUBE_API_KEY
        - name: TWITTER_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: TWITTER_BEARER_TOKEN
        - name: TIKTOK_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: TIKTOK_ACCESS_TOKEN
        - name: FACEBOOK_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: FACEBOOK_ACCESS_TOKEN

        # Communication API Keys
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: SENDGRID_API_KEY
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: DISCORD_BOT_TOKEN
        - name: LINE_CHANNEL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: LINE_CHANNEL_ACCESS_TOKEN
        - name: LINE_CHANNEL_SECRET
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: LINE_CHANNEL_SECRET

        # AI and Analytics
        - name: AI_CONTENT_ANALYSIS_API_KEY
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: AI_CONTENT_ANALYSIS_API_KEY

        # Monitoring
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: kol-system-secrets
              key: SENTRY_DSN
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: LOG_LEVEL

        # Additional Configuration
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: RATE_LIMIT_REQUESTS_PER_MINUTE
        - name: CONTENT_DETECTION_CONFIDENCE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: CONTENT_DETECTION_CONFIDENCE_THRESHOLD
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: kol-system-config
              key: CORS_ORIGINS

        volumeMounts:
        - name: upload-storage
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

      volumes:
      - name: upload-storage
        persistentVolumeClaim:
          claimName: upload-pvc
      - name: logs
        emptyDir: {}

      # Node selection for production workloads
      nodeSelector:
        workload-type: production

      # Pod security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Image pull secrets (if using private registry)
      imagePullSecrets:
      - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: kol-api-service
  namespace: kol-system
  labels:
    app: kol-api
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: kol-api
    component: backend

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: upload-pvc
  namespace: kol-system
  labels:
    app: kol-api
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 50Gi

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kol-api-hpa
  namespace: kol-system
  labels:
    app: kol-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kol-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kol-api-pdb
  namespace: kol-system
  labels:
    app: kol-api
    component: backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kol-api
      component: backend