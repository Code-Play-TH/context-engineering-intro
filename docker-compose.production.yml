version: '3.8'

# Production Docker Compose for KOL Management System
# Uses custom ports to avoid conflicts with other applications

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: kolsystem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "${POSTGRES_PORT}:5432"  # Custom external port
    networks:
      - kolsystem_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"

  # ============================================
  # Redis Cache & Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: kolsystem_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"  # Custom external port
    networks:
      - kolsystem_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # API Application
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kolsystem_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=${APP_PORT}
    ports:
      - "${APP_PORT}:8000"  # Custom external port
    networks:
      - kolsystem_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      gunicorn app.main:app
      --workers ${WORKERS:-4}
      --worker-class ${WORKER_CLASS:-uvicorn.workers.UvicornWorker}
      --bind 0.0.0.0:8000
      --timeout ${TIMEOUT:-60}
      --keep-alive ${KEEP_ALIVE:-5}
      --max-requests ${MAX_REQUESTS:-10000}
      --max-requests-jitter ${MAX_REQUESTS_JITTER:-1000}
      --access-logfile /app/logs/access.log
      --error-logfile /app/logs/error.log
      --log-level ${LOG_LEVEL:-info}

  # ============================================
  # Celery Worker
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kolsystem_celery_worker
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - kolsystem_network
    depends_on:
      - postgres
      - redis
      - api
    volumes:
      - ./logs:/app/logs
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=${LOG_LEVEL:-info}
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      --max-tasks-per-child=1000
      --time-limit=3600
      --soft-time-limit=3000
      --logfile=/app/logs/celery_worker.log
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Celery Beat (Scheduler)
  # ============================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kolsystem_celery_beat
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - kolsystem_network
    depends_on:
      - postgres
      - redis
      - api
    volumes:
      - ./logs:/app/logs
      - celerybeat_schedule:/app/celerybeat
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=${LOG_LEVEL:-info}
      --logfile=/app/logs/celery_beat.log
      --pidfile=/app/celerybeat/celerybeat.pid
      --schedule=/app/celerybeat/celerybeat-schedule

  # ============================================
  # Celery Flower (Monitoring)
  # ============================================
  celery_flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: kolsystem_celery_flower
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${CELERY_FLOWER_PORT}:5555"  # Custom external port
    networks:
      - kolsystem_network
    depends_on:
      - redis
      - celery_worker
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555
      --max_tasks=10000
      --purge_offline_workers=60
      --basic_auth=${CELERY_FLOWER_USER:-admin}:${CELERY_FLOWER_PASSWORD:-admin}

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: kolsystem_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"  # Custom external port
      - "8767:443"           # HTTPS port (custom)
    networks:
      - kolsystem_network
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl:ro
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Prometheus (Metrics)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kolsystem_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"  # Custom external port
    networks:
      - kolsystem_network
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: kolsystem_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"  # Custom external port
    networks:
      - kolsystem_network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

# ============================================
# Networks
# ============================================
networks:
  kolsystem_network:
    driver: bridge
    name: kolsystem_network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    name: kolsystem_postgres_data
  redis_data:
    name: kolsystem_redis_data
  prometheus_data:
    name: kolsystem_prometheus_data
  grafana_data:
    name: kolsystem_grafana_data
  celerybeat_schedule:
    name: kolsystem_celerybeat_schedule
